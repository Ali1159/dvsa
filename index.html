<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }
    .calculator {
      width: min(340px, 92vw);
      padding: 20px;
      border-radius: 16px;
      background: #222;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }
    #display {
      width: 100%;
      height: 70px;
      margin-bottom: 15px;
      padding: 10px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      font-size: 2rem;
      text-align: right;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 60px;
      border: 0;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      background: #444;
      color: #fff;
    }
    button:hover { background: #555; }
    .operator { background: #666; }
    .equals { background: #888; }
    .clear { background: #a33; }
  </style>
</head>
<body>
  <main class="calculator">
    <input id="display" type="text" value="0" readonly aria-label="Calculator display">

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('0')" style="grid-column: span 2">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      if (display.value === '0' && !['.', '+', '-', '*', '/', '%'].includes(value)) {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      display.value = display.value.length > 1 ? display.value.slice(0, -1) : '0';
    }

    function calculate() {
      try {
        if (!/^[0-9+\-*/%.()\s]+$/.test(display.value)) throw new Error();
        const result = Function('"use strict"; return (' + display.value + ')')();
        if (!Number.isFinite(result)) throw new Error();
        display.value = result;
      } catch {
        display.value = 'Error';
        setTimeout(clearDisplay, 1000);
      }
    }

    document.addEventListener('keydown', (event) => {
      if (/[0-9+\-*/%.]/.test(event.key)) appendValue(event.key);
      else if (event.key === 'Enter' || event.key === '=') calculate();
      else if (event.key === 'Escape') clearDisplay();
      else if (event.key === 'Backspace') deleteLast();
    });
  </script>
</body>
</html>
